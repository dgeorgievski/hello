name: Build Go App

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app-name:
        description: 'Application name'
        default: 'hello'
        required: true
        type: string
      go-version:
        description: 'Go version'
        required: false
        type: string
        default: '1.24'
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      docker-context:
        description: 'Context for Docker build. Default .'
        required: false
        type: string
        default: '.'
      docker-file:
        description: 'Dockerfile path. Default ./docker/Dockerfile'
        required: false
        type: string
        default: './docker/Dockerfile'
      docker-push:
        description: 'Push the Docker image to the registry. Default true'
        required: false
        type: boolean
        default: true
      check_all_workflows:
        description: 'Check all workflows for SHA pinned actions. Default false'
        required: false
        type: boolean
        default: false

jobs:
  hardened-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Extract workflow filename from github.workflow_ref
        id: get-filename
        run: |
          if [ "${{ inputs.check_all_workflows }}" = "true" ]; then
            echo "Checking all workflows as 'check_all_workflows' is set to true."
            FILENAME="all"
          else
            echo "Checking only the current workflow: $FILENAME"
            # The variable `REF` will contain a string like `octocat/repo/.github/workflows/workflow-name-test.yml@...`
            REF="${{ github.workflow_ref }}"

            # Strip the ref suffix (everything after the first "@") and take the filename.
            FILE_PATH="${REF%@*}"
            echo "file_path=$FILE_PATH"
            
            FILENAME=$(basename "$FILE_PATH")
            echo "Extracted workflow_filename: $FILENAME"
          fi
          echo "workflow_filename=$FILENAME" >> "$GITHUB_OUTPUT"
      - name: Ensure SHA pinned actions
        uses: dgeorgievski/github-actions-ensure-sha-pinned-actions@05677a3654dea536488107828430ca535197061d
        with:
          dry_run: true
          workflow_name: ${{ steps.get-filename.outputs.workflow_filename }}
  test-build:
    uses: dgeorgievski/my-github-actions/.github/workflows/go-build.yml@d91ceed8c75e6fde019140f003d292cd1c86bfe9 # v0.0.3
    needs: hardened-security
    with:
      app-name: ${{ inputs.app-name }}
      go-version: ${{ inputs.go-version }}
      registry: ${{ inputs.registry }}
      docker-context: ${{ inputs.docker-context }}
      docker-file: ${{ inputs.docker-file }}
      docker-push: ${{ inputs.docker-push }}
    secrets: inherit

      
